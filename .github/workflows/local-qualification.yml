name: Official local qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registered owner device and native OS
        required: true
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - windows-x64
          - linux-x64

permissions:
  contents: read

concurrency:
  group: local-qualification-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  committed-corpus:
    # Trusted default-branch dispatch only; never execute a public PR on a personal runner.
    if: github.repository == 'edithatogo/limma-rust' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.target == 'macos-arm64' && '["self-hosted","macOS","ARM64","rare-omics-local"]' || inputs.target == 'windows-x64' && '["self-hosted","Windows","X64","rare-omics-local"]' || '["self-hosted","Linux","X64","rare-omics-local"]') }}
    timeout-minutes: 20
    env:
      # An empty value selects the checked-in corpus and excludes a host's private override.
      MD_GOLDEN_CORPUS_DIR: ""
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the dispatched trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-22
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Record source and install the pinned compiler
        env:
          CARGO_HOME: ${{ runner.temp }}/limma-rust-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/limma-rust-rustup-${{ github.run_id }}
        run: |
          git rev-parse HEAD
          rustup --version
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustc +1.95.0 --version --verbose
          cargo +1.95.0 --version
      - name: Check formatting
        env:
          CARGO_HOME: ${{ runner.temp }}/limma-rust-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/limma-rust-rustup-${{ github.run_id }}
        run: cargo +1.95.0 fmt --all -- --check
      - name: Check lint and compilation
        env:
          CARGO_HOME: ${{ runner.temp }}/limma-rust-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/limma-rust-rustup-${{ github.run_id }}
        run: cargo +1.95.0 clippy --all-targets --locked -- -D warnings
      - name: Replay the existing committed corpus
        env:
          CARGO_HOME: ${{ runner.temp }}/limma-rust-cargo-${{ github.run_id }}
          RUSTUP_HOME: ${{ runner.temp }}/limma-rust-rustup-${{ github.run_id }}
        run: cargo +1.95.0 test --locked
