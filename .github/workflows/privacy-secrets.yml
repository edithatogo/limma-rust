# Adopt the existing central scanner; keep it independent of application execution.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '27 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan with the central privacy baseline
        uses: edithatogo/repository-standards/.github/actions/privacy-secrets@0be4668d17ac3b6d902d4354bd01f420c7c29272
        with:
          profile: repository
