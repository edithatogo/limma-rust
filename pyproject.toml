[project]
name = "limma-verification"
version = "0.1.0"
description = "Isolated developer checks for limma-core; no numerical runtime dependency"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "coverage==7.17.4",
  "diff-cover==11.0.4",
  "pip-audit==2.10.1",
  "pyright==1.1.409",
  "ruff==0.15.13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["scripts"]
exclude = ["scripts/test_verify.py"]

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/test_*.py"]

[tool.coverage.report]
show_missing = true
